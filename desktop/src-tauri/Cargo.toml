[package]
name = "toodoo-desktop"
version = "0.1.0"
description = "Toodoo desktop app"
edition = "2021"

[lib]
name = "toodoo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Not used directly — tauri::generate_context! expands to serde_json calls.
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# Verifies that a server the user enters really is a toodoo deployment. Same
# TLS setup as tauri-plugin-updater (rustls + ring, no bundled provider) so
# the two share one stack instead of compiling a second one.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Thin LTO: near-fat-LTO binary size at a fraction of the link time (all the
# real work in this shell happens in the webview, not Rust).
[profile.release]
lto = "thin"
strip = true
