[package]
name = "toodoo-desktop"
version = "0.1.0"
description = "Toodoo desktop app"
edition = "2021"

[lib]
name = "toodoo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Not used directly — tauri::generate_context! expands to serde_json calls.
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"

# Thin LTO: near-fat-LTO binary size at a fraction of the link time (all the
# real work in this shell happens in the webview, not Rust).
[profile.release]
lto = "thin"
strip = true
