name: Desktop build

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

jobs:
  # The draft release is created once, up front — two matrix jobs creating it
  # concurrently via tauri-action can race into duplicate drafts
  # (tauri-apps/tauri-action#914).
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        shell: bash
        env:
          # Via env, not inline interpolation: tag names may contain shell
          # metacharacters and this workflow holds the updater signing key.
          REF_NAME: ${{ github.ref_name }}
        run: |
          conf=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./desktop/package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' desktop/src-tauri/Cargo.toml | head -1)
          if [ "$conf" != "$pkg" ] || [ "$conf" != "$cargo" ]; then
            echo "Version drift: tauri.conf.json=$conf package.json=$pkg Cargo.toml=$cargo" >&2
            exit 1
          fi
          if [ "desktop-v$conf" != "$REF_NAME" ]; then
            echo "Tag $REF_NAME does not match app version $conf" >&2
            exit 1
          fi

      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `Toodoo Desktop ${context.ref.replace('refs/tags/', '')}`,
              draft: true,
            });
            return data.id;

  build:
    needs: create-release
    # Also run on workflow_dispatch, where create-release is skipped and the
    # job just builds without uploading anywhere.
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # Only the desktop package's deps (@tauri-apps/cli) — the web app's
      # toolchain is never used by this build.
      - run: pnpm install --frozen-lockfile --filter toodoo-desktop

      # Forks ship their own app without editing source: the bundle identifier
      # and updater public key come from repository variables, and the updater
      # endpoint always points at the repository running this build. Fails
      # with instructions when a fork hasn't set them (see desktop/README.md).
      - name: Apply fork configuration
        shell: bash
        env:
          DESKTOP_BUNDLE_ID: ${{ vars.DESKTOP_BUNDLE_ID }}
          DESKTOP_UPDATER_PUBKEY: ${{ vars.DESKTOP_UPDATER_PUBKEY }}
        run: node desktop/scripts/apply-fork-config.mjs

      # Updater artifacts are signed with TAURI_SIGNING_* (required).
      # tagName is passed alongside releaseId so latest.json download URLs
      # point at this tag's assets rather than releases/latest.
      # OS code signing is not set up yet; to add it later:
      #   macOS: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      #          APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID (notarization)
      #   Windows: a code-signing cert or Azure Trusted Signing
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional, for forks only: pins the build to one deployment (no
          # server picker). Unset/empty — the upstream default — builds the
          # generic app that asks for the server on first launch.
          TOODOO_APP_URL: ${{ secrets.TOODOO_APP_URL }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          retryAttempts: 3
