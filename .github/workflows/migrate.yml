name: Database migrations

# Applies pending drizzle migrations to the production database whenever a
# push to main touches them. Vercel deploys the same push in parallel, so
# nothing orders the two: each migration has to keep working with the code
# on both sides of it — the old deployment against the new schema, and the
# new deployment for the moment it may run ahead. A change that can't (a
# column dropped or renamed while code still reads it) ships in two steps.
#
# Requires the DATABASE_URL secret: a connection string for a role that owns
# the schema (Neon's `neondb_owner`, or the role in DATABASE_URL on Vercel).
on:
  push:
    branches: [main]
    paths:
      - "drizzle/**"
      - "drizzle.config.ts"
      - ".github/workflows/migrate.yml"
  workflow_dispatch:

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm drizzle-kit migrate
